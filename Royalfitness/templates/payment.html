{% extends "base.html" %}
{% block content %}
<h1>Complete Your Payment</h1>

<p>Plan: {{ enrollment_data.SelectMembershipplan }}</p>
<p>Amount: ₹{{ payment.amount|floatformat:0|divisibleby:100 }}</p>

<button id="rzp-button1" class="btn btn-warning">Pay with Razorpay</button>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_id }}",
    "amount": {{ payment.amount }},  // Amount in paise
    "currency": "INR",
    "name": "Royal Fitness Gym",
    "description": "Membership Payment",
    "order_id": "{{ order_id }}",
    "callback_url": "{% url 'payment-success' %}",  // POST to payment_success view
    "prefill": {
        "name": "{{ request.user.username }}",
        "email": "{{ request.user.email }}",
        "contact": "{{ request.user.username }}"
    },
    "theme": {
        "color": "#f7b731"
    }
};
var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
{% endblock %}
